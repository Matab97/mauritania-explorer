# ─────────────────────────────────────────────────────────────────────────────
# Mauritania Explorer — nginx origin config (served behind a Cloudflare Tunnel)
#
# This is the LOCAL origin server that `cloudflared` forwards to. Cloudflare's
# edge adds its own compression (gzip/brotli) and honours the Cache-Control
# headers set here, so updates you ship propagate predictably.
#
# Usage:
#   1. Set `root` below to the absolute path of this repo on your Linux box.
#   2. Drop this file in /etc/nginx/conf.d/ (or include it from nginx.conf),
#      then: sudo nginx -t && sudo systemctl reload nginx
#   3. Point your tunnel ingress at this server, e.g. in ~/.cloudflared/config.yml:
#        ingress:
#          - hostname: mauritania.example.com
#            service: http://localhost:8080
#          - service: http_status:404
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 8080;
    server_name _;

    # >>> CHANGE THIS to the absolute path of the repo on your machine <<<
    root /srv/mauritania-explorer;
    index index.html;

    charset utf-8;

    # ── Compression (Cloudflare also compresses at the edge) ──
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # ── HTML: always revalidate so new deploys appear immediately ──
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ── Static assets: ES modules, styles, icons ──
    # 10 min cache means edits propagate quickly without a build/hashing step.
    # (For instant busting of entry points, append ?v=N to the main.js / styles.css
    #  references in index.html when you ship a change.)
    location ~* \.(?:js|mjs|css|svg)$ {
        add_header Cache-Control "public, max-age=600";
        try_files $uri =404;
    }

    # ── Everything else ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
