<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mauritania Explorer</title>
  <meta name="description" content="An interactive explorer of Mauritania's most remarkable places — from the Eye of the Sahara to the Iron Ore Train."/>
  <!-- Favicons (desert dune-wave mark) -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg"/>
  <link rel="apple-touch-icon" href="favicon.svg"/>
  <link rel="mask-icon" href="favicon.svg" color="#c0622a"/>
  <meta name="theme-color" content="#160f06"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Claim the YT callback synchronously before any module has a chance to load.
       ES modules are deferred; the YouTube API can fire onYouTubeIframeAPIReady
       before modules execute. We queue the event here so music.js can drain it. -->
  <script>
    window.__ytApiReadyCalled = false;
    window.onYouTubeIframeAPIReady = function() {
      window.__ytApiReadyCalled = true;
      if (typeof window.__ytApiReadyHandler === 'function') {
        window.__ytApiReadyHandler();
      }
    };
  </script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.css" rel="stylesheet"/>
  <link href="css/styles.css" rel="stylesheet"/>
</head>
<body>

<canvas id="sandCanvas"></canvas>

<!-- Signature sand-wave transition curtain -->
<div id="sandWave" aria-hidden="true">
  <div class="sw-body"></div>
  <div class="sw-grain"></div>
  <!-- Leading dune ridge (wavy vertical profile) -->
  <div class="sw-edge lead">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M100,0 H44 Q70,12 50,25 Q28,40 56,52 Q82,64 48,76 Q22,88 60,100 H100 Z"
            fill="#b8975c"/>
      <path d="M100,0 H62 Q84,14 64,28 Q44,42 70,54 Q92,66 60,78 Q38,90 72,100 H100 Z"
            fill="#c0622a" opacity=".55"/>
    </svg>
  </div>
  <!-- Trailing dune ridge (mirrored) -->
  <div class="sw-edge trail">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M100,0 H44 Q70,12 50,25 Q28,40 56,52 Q82,64 48,76 Q22,88 60,100 H100 Z"
            fill="#9c3a1e" opacity=".7"/>
    </svg>
  </div>
</div>

<div id="app">
  <header>
    <!-- Logo: dune-wave + crescent-and-star motif + wordmark -->
    <svg class="logo-svg" height="48" viewBox="0 0 250 54" xmlns="http://www.w3.org/2000/svg">
      <!-- Dune-wave ridges -->
      <path d="M6,42 Q18,24 30,34 Q42,44 54,26 Q62,14 74,30"
            stroke="#c0622a" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <path d="M6,47 Q18,32 32,40 Q44,47 56,30 Q64,22 78,35"
            stroke="#e8c87a" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".5"/>
      <!-- Crescent + star rising over the dunes (national motif) -->
      <path d="M40,8 A6 6 0 1 0 40,20 A4.5 4.5 0 1 1 40,8 Z" fill="#f0c14b"/>
      <path transform="translate(45.8 8.4) scale(0.3)" fill="#f0c14b"
            d="M12 2l2.9 6.3 6.9.6-5.2 4.5 1.6 6.8L12 17.3 5.8 20.2l1.6-6.8L2.2 8.9l6.9-.6z"/>
      <!-- Wordmark -->
      <text x="92" y="26" font-family="'Reem Kufi','Amiri',serif" font-size="19" fill="#e8c87a" font-weight="700" letter-spacing=".5">MAURITANIA</text>
      <text x="93" y="41" font-family="Inter,sans-serif" font-size="8.5" fill="#9e8b6e" letter-spacing="3.5">EXPLORER</text>
      <defs>
        <linearGradient id="lgLine" x1="0" x2="1">
          <stop offset="0%" stop-color="#c0622a"/>
          <stop offset="100%" stop-color="#3a8fa8" stop-opacity=".4"/>
        </linearGradient>
      </defs>
      <line x1="92" y1="46" x2="248" y2="46" stroke="url(#lgLine)" stroke-width="1"/>
    </svg>
    <p id="tagline">Click on any location to discover it</p>

    <!-- Category legend with count badges -->
    <div class="legend" id="legendBar">
      <div class="legend-item active" data-cat="all">
        <div class="legend-dot" style="color:#cbb386">
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 1 L9.4 6.6 L15 8 L9.4 9.4 L8 15 L6.6 9.4 L1 8 L6.6 6.6 Z" fill="currentColor"/>
            <circle cx="8" cy="8" r="1.3" fill="#160f06"/>
          </svg>
        </div><span class="legend-text">All</span><span class="cat-count" id="cnt-all">11</span>
      </div>
      <div class="legend-item" data-cat="nature">
        <div class="legend-dot" style="color:#7aa055">
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="11.4" cy="4.6" r="2.1" fill="currentColor" opacity=".85"/>
            <path d="M1 13 Q4.5 7 8 11 Q11.5 15 15 9 L15 15 L1 15 Z" fill="currentColor"/>
          </svg>
        </div><span class="legend-text">Nature</span><span class="cat-count" id="cnt-nature">4</span>
      </div>
      <div class="legend-item" data-cat="historic">
        <div class="legend-dot" style="color:#c0622a">
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 15 L3 8 Q3 2.5 8 2.5 Q13 2.5 13 8 L13 15 L10 15 L10 8 Q10 5.5 8 5.5 Q6 5.5 6 8 L6 15 Z" fill="currentColor"/>
            <path d="M8 0.6 L8 2.6 M7.2 1.6 L8.8 1.6" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
          </svg>
        </div><span class="legend-text">Historic</span><span class="cat-count" id="cnt-historic">3</span>
      </div>
      <div class="legend-item" data-cat="transport">
        <div class="legend-dot" style="color:#4a9db5">
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <line x1="5" y1="1.5" x2="5" y2="14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="11" y1="1.5" x2="11" y2="14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="3.5" y1="4" x2="12.5" y2="4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            <line x1="3.5" y1="8" x2="12.5" y2="8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            <line x1="3.5" y1="12" x2="12.5" y2="12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </div><span class="legend-text">Transport</span><span class="cat-count" id="cnt-transport">1</span>
      </div>
      <div class="legend-item" data-cat="city">
        <div class="legend-dot" style="color:#b39a6f">
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1.5 15 L1.5 9 L4 9 L4 6.5 L6.5 4 L9 6.5 L9 9 L11 9 L11 7 L14.5 7 L14.5 15 Z" fill="currentColor"/>
            <path d="M6.5 4 L6.5 2 M5.7 2.8 L7.3 2.8" stroke="currentColor" stroke-width=".9" stroke-linecap="round"/>
          </svg>
        </div><span class="legend-text">Cities</span><span class="cat-count" id="cnt-city">3</span>
      </div>
    </div>

    <!-- Walking camel decoration -->
    <div class="header-camel">🐪</div>
  </header>

  <div class="map-area">
    <div id="map"></div>
  </div>

  <div class="music-bar">
    <div id="musicPulse" class="music-pulse" style="display:none"></div>
    <button class="music-btn" id="musicBtn">
      <svg id="musicIcon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
        <path d="M8 5v14l11-7z"/>
      </svg>
      <span id="musicBtnText">Play Music</span>
    </button>
    <span class="music-info" id="musicLabel">—</span>
    <div class="lang-toggle">
      <button class="lang-toggle-btn active" data-lang="en">EN</button>
      <button class="lang-toggle-btn" data-lang="ar">ع</button>
    </div>
    <a href="https://www.linkedin.com/in/mohamed-lemine-abbad/" target="_blank" rel="noopener" aria-label="LinkedIn" class="linkedin-link">
      <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M20.45 20.45H17V14.88c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.57V9h3.27v1.56h.05c.46-.87 1.58-1.78 3.24-1.78 3.46 0 4.1 2.28 4.1 5.24l.02 5.93zM5.34 7.43a1.9 1.9 0 1 1 0-3.8 1.9 1.9 0 0 1 0 3.8zM6.9 20.45H3.77V9H6.9v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45C23.2 24 24 23.23 24 22.28V1.72C24 .77 23.2 0 22.22 0z"/>
      </svg>
    </a>
  </div>

  <div id="ytPlayer"></div>
</div>

<!-- World inset map (Africa-focused) -->
<div id="worldInset">
  <svg viewBox="0 0 84 64" xmlns="http://www.w3.org/2000/svg" width="84" height="64">
    <!-- Ocean background -->
    <rect width="84" height="64" fill="#080c14"/>
    <!-- Subtle grid -->
    <line x1="0" y1="32" x2="84" y2="32" stroke="#0e1a24" stroke-width=".4"/>
    <line x1="42" y1="0" x2="42" y2="64" stroke="#0e1a24" stroke-width=".4"/>
    <!-- European coast (rough) -->
    <path d="M14 0 L52 0 L54 6 L50 10 L46 8 L40 10 L36 8 L28 10 L20 8 L14 4Z"
          fill="#1a1208" stroke="#221808" stroke-width=".4"/>
    <!-- Africa main body -->
    <path d="M12 10 L32 8 L52 10 L60 16 L62 24 L58 34 L58 40 L52 52 L46 58 L40 60 L34 58 L30 52 L30 44 L34 36 L32 26 L26 22 L16 24 L10 20Z"
          fill="#1e1508" stroke="#2a1c0a" stroke-width=".5"/>
    <!-- Western bulge (Gulf of Guinea) -->
    <path d="M26 22 L18 28 L14 34 L16 40 L20 38 L24 34 L28 36 L30 44 L30 52" stroke="#2a1c0a" stroke-width=".3" fill="none"/>
    <!-- Mauritania region highlight -->
    <path d="M12 10 L26 8 L28 20 L22 24 L12 22Z" fill="#c0622a" opacity=".55"/>
    <!-- Atlantic shimmer -->
    <rect x="0" y="0" width="11" height="64" fill="#0a1624" opacity=".6"/>
    <!-- Marker: Nouakchott approx -->
    <circle cx="16" cy="17" r="2.8" fill="#e8c87a"/>
    <circle cx="16" cy="17" r="5.2" stroke="#c0622a" stroke-width=".9" fill="none" class="inset-dot-ring"/>
  </svg>
  <div class="inset-label">MAURITANIA</div>
</div>

<!-- Intro overlay: logo + language picker -->
<div id="musicOverlay">
  <div class="overlay-stars"></div>
  <!-- Logo: dune-wave + crescent-and-star motif + wordmark -->
  <svg class="overlay-logo" height="72" viewBox="0 0 250 54" xmlns="http://www.w3.org/2000/svg">
    <path d="M6,42 Q18,24 30,34 Q42,44 54,26 Q62,14 74,30"
          stroke="#c0622a" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <path d="M6,47 Q18,32 32,40 Q44,47 56,30 Q64,22 78,35"
          stroke="#e8c87a" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".5"/>
    <path d="M40,8 A6 6 0 1 0 40,20 A4.5 4.5 0 1 1 40,8 Z" fill="#f0c14b"/>
    <path transform="translate(45.8 8.4) scale(0.3)" fill="#f0c14b"
          d="M12 2l2.9 6.3 6.9.6-5.2 4.5 1.6 6.8L12 17.3 5.8 20.2l1.6-6.8L2.2 8.9l6.9-.6z"/>
    <text x="92" y="26" font-family="'Reem Kufi','Amiri',serif" font-size="19" fill="#e8c87a" font-weight="700" letter-spacing=".5">MAURITANIA</text>
    <text x="93" y="41" font-family="Inter,sans-serif" font-size="8.5" fill="#9e8b6e" letter-spacing="3.5">EXPLORER</text>
    <line x1="92" y1="46" x2="248" y2="46" stroke="#c0622a" stroke-width="1" opacity=".5"/>
  </svg>
  <p>An interactive journey through the Sahara · رحلة تفاعلية عبر الصحراء</p>
  <div class="lang-choice">
    <button class="lang-choice-btn" data-lang="en">English</button>
    <button class="lang-choice-btn" data-lang="ar">العربية</button>
  </div>
  <!-- Dune silhouette -->
  <svg class="overlay-dunes" viewBox="0 0 400 90" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,90 L0,55 Q50,22 100,50 Q150,78 200,44 Q250,10 300,50 Q350,80 400,55 L400,90Z" fill="rgba(192,98,42,.12)"/>
    <path d="M0,90 L0,65 Q60,38 120,58 Q180,78 240,52 Q300,24 360,58 Q390,72 400,65 L400,90Z" fill="rgba(26,18,8,.65)"/>
  </svg>
</div>

<!-- Backdrop -->
<div class="panel-backdrop" id="backdrop"></div>

<!-- Info Panel -->
<div class="info-panel" id="infoPanel">
  <div style="position:relative">
    <div id="panelHero" class="panel-hero-ph"></div>
    <button class="panel-close">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none">
        <line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="20" y1="4" x2="4" y2="20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div class="panel-nav">
    <button class="nav-btn nav-prev">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><polyline points="15,18 9,12 15,6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="navPrevText">Prev</span>
    </button>
    <span class="nav-counter" id="navCounter"></span>
    <button class="nav-btn nav-next">
      <span id="navNextText">Next</span>
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><polyline points="9,18 15,12 9,6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="panel-body">
    <div class="panel-cat" id="panelCat"></div>
    <div class="panel-title" id="panelTitle"></div>
    <div class="panel-sub"  id="panelSub"></div>
    <div class="panel-desc" id="panelDesc"></div>
    <div class="panel-facts" id="panelFacts"></div>
    <div class="panel-links" id="panelLinks"></div>
  </div>
</div>


<a id="homeLink" href="https://abbad.app" style="position:fixed;top:10px;left:10px;z-index:100;background:rgba(192,98,42,.5);border:1px solid rgba(192,98,42,.6);color:#e8c87a;padding:3px 10px;border-radius:99px;font-size:.62rem;font-weight:600;text-decoration:none;transition:opacity .2s;">← home</a>

<script type="module" src="js/main.js"></script>
</body>
</html>
