<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mauritania Explorer</title>
  <meta name="description" content="An interactive explorer of Mauritania's most remarkable places — from the Eye of the Sahara to the Iron Ore Train."/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.css" rel="stylesheet"/>
  <style>
    /* ── Design tokens ── */
    :root {
      --sand: #e8d5a3; --sand-dark: #c9b07a; --sand-light: #f5ead0;
      --terracotta: #c0622a; --terracotta-dark: #8b4115;
      --ink: #1a1208; --stone: #9e8b6e; --stone-dark: #6b5d42; --gold: #e8c87a;
      --teal: #4a9db5;
      --col-nature: #6a8c4f; --col-historic: #c0622a;
      --col-transport: #4a9db5; --col-city: #9e8b6e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: var(--ink); }

    /* ── Sand particle canvas ── */
    #sandCanvas { position: fixed; inset: 0; z-index: 2; pointer-events: none; }

    /* ── App shell ── */
    #app { position: relative; z-index: 4; width: 100%; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* ── Header ── */
    header { flex-shrink: 0; text-align: center; padding: 10px 16px 5px; position: relative; }
    .logo-svg { display: block; margin: 0 auto 3px; }
    header > p { font-size: .7rem; color: #b09060; margin-top: 1px; letter-spacing: .5px; }

    /* Camel walking across header bottom edge */
    .header-camel {
      position: absolute; bottom: 0; left: -40px;
      font-size: 1.1rem; opacity: .3; pointer-events: none;
      animation: camelWalk 22s linear infinite;
    }
    @keyframes camelWalk {
      0%   { left: -40px; opacity: 0; }
      4%   { opacity: .3; }
      96%  { opacity: .3; }
      100% { left: calc(100% + 40px); opacity: 0; }
    }

    /* ── Search row ── */
    .search-row {
      display: flex; align-items: center; justify-content: center; gap: 7px;
      padding: 4px 12px;
    }
    .search-wrap { position: relative; flex: 1; max-width: 260px; }
    .search-wrap .s-icon {
      position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
      pointer-events: none; opacity: .45;
    }
    .search-input {
      width: 100%;
      background: rgba(0,0,0,.72);
      border: 1.5px solid rgba(232,200,122,.16);
      color: var(--sand);
      font-family: 'Inter', sans-serif;
      font-size: .75rem;
      padding: 5px 10px 5px 30px;
      border-radius: 99px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .search-input::placeholder { color: #6b5d42; }
    .search-input:focus {
      border-color: rgba(192,98,42,.6);
      box-shadow: 0 0 0 2px rgba(192,98,42,.14);
    }

    /* Reset / clear button */
    .reset-btn {
      background: rgba(192,98,42,.22);
      border: 1.5px solid rgba(192,98,42,.5);
      color: var(--gold);
      border-radius: 99px; padding: 4px 11px;
      font-size: .72rem; cursor: pointer;
      display: none; align-items: center; gap: 4px;
      transition: all .2s; white-space: nowrap;
    }
    .reset-btn:hover { background: rgba(192,98,42,.42); }
    .reset-btn.visible { display: inline-flex; }

    /* ── Category legend with count badges ── */
    .legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 5px; padding: 4px 12px; }
    .legend-item {
      display: flex; align-items: center; gap: 5px;
      font-size: .7rem; color: #c8a870; cursor: pointer;
      padding: 3px 9px; border-radius: 99px;
      background: rgba(0,0,0,.72); border: 1.5px solid rgba(255,255,255,.1);
      transition: background .2s, border-color .2s, color .2s;
    }
    .legend-item:hover, .legend-item.active {
      border-color: #c0622a; background: rgba(192,98,42,.35); color: var(--gold);
    }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .cat-count {
      background: rgba(0,0,0,.4); border-radius: 99px;
      padding: 1px 5px; font-size: .6rem; font-weight: 700;
      color: var(--stone-dark); min-width: 16px; text-align: center;
      transition: color .2s;
    }
    .legend-item.active .cat-count { color: var(--gold); }

    /* ── Map area ── */
    .map-area { flex: 1; display: flex; min-height: 0; position: relative; }
    #map { width: 100%; height: 100%; }

    /* MapLibre attribution */
    .maplibregl-ctrl-attrib { background: rgba(26,18,8,.7)!important; color: #6b5d42!important; font-size: 9px!important; border-radius: 6px 0 0 0!important; }
    .maplibregl-ctrl-attrib a { color: #9e8b6e!important; }
    .maplibregl-ctrl-bottom-right { bottom: 40px!important; }

    /* ── Custom markers ── */
    /* NOTE: MapLibre positions .mb-marker via an inline `transform`.
       Do NOT set transform/position/animation here — those live on the
       inner wrapper so MapLibre's positioning is never clobbered. */
    .mb-marker { cursor: pointer; }
    .mb-marker-inner {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      animation: markerDrop .4s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes markerDrop {
      from { transform: translateY(-24px) scale(.3); opacity: 0; }
      to   { transform: translateY(0) scale(1); opacity: 1; }
    }
    .mb-icon {
      width: 42px; height: 42px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid rgba(255,255,255,.22);
      box-shadow: 0 3px 14px rgba(0,0,0,.65);
      transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease;
      background: #140c04;
      position: relative;
      will-change: transform;
    }
    .mb-icon svg { width: 22px; height: 22px; display: block; }
    .mb-marker:hover .mb-icon { transform: scale(1.18); box-shadow: 0 6px 22px rgba(0,0,0,.85); }

    /* Emphasize state (from Mapbox reference pattern) */
    .mb-marker.emphasized .mb-icon {
      transform: scale(1.38);
      border-width: 2.5px;
    }
    .mb-marker.emphasized .mb-label { color: var(--gold); font-weight: 700; }

    /* Category border + glow colors */
    .mb-marker[data-cat="nature"]    .mb-icon { border-color: var(--col-nature); }
    .mb-marker[data-cat="historic"]  .mb-icon { border-color: var(--col-historic); }
    .mb-marker[data-cat="transport"] .mb-icon { border-color: var(--col-transport); }
    .mb-marker[data-cat="city"]      .mb-icon { border-color: var(--col-city); }

    /* Per-category glow when emphasized */
    .mb-marker.emphasized[data-cat="nature"]    .mb-icon { box-shadow: 0 8px 28px rgba(0,0,0,.9), 0 0 22px rgba(106,140,79,.55); }
    .mb-marker.emphasized[data-cat="historic"]  .mb-icon { box-shadow: 0 8px 28px rgba(0,0,0,.9), 0 0 22px rgba(192,98,42,.55); }
    .mb-marker.emphasized[data-cat="transport"] .mb-icon { box-shadow: 0 8px 28px rgba(0,0,0,.9), 0 0 22px rgba(74,157,181,.55); }
    .mb-marker.emphasized[data-cat="city"]      .mb-icon { box-shadow: 0 8px 28px rgba(0,0,0,.9), 0 0 22px rgba(158,139,110,.55); }

    .mb-label {
      font-size: 9px; font-weight: 600; letter-spacing: .3px;
      color: var(--sand); text-shadow: 0 1px 4px rgba(0,0,0,.9), 0 0 8px rgba(0,0,0,.9);
      white-space: nowrap; pointer-events: none; transition: color .2s;
    }

    /* Capital pulsing ring */
    .mb-marker[data-id="nouakchott"] .mb-icon::after {
      content: ''; position: absolute; inset: -7px; border-radius: 50%;
      border: 1.5px solid rgba(158,139,110,.5);
      animation: ringPulse 2s ease-in-out infinite;
    }
    @keyframes ringPulse { 0%,100% { transform: scale(1); opacity: .6; } 50% { transform: scale(1.2); opacity: .15; } }

    /* Click ripple */
    .mb-marker.clicked .mb-icon::before {
      content: ''; position: absolute; inset: -4px; border-radius: 50%;
      background: rgba(232,200,122,.35);
      animation: clickRipple .55s ease-out forwards;
    }
    @keyframes clickRipple { from { transform: scale(1); opacity: .9; } to { transform: scale(3.2); opacity: 0; } }

    /* Train terminal dot */
    .mb-train-dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--col-transport); border: 2px solid rgba(255,255,255,.6);
      box-shadow: 0 2px 8px rgba(0,0,0,.5);
      cursor: pointer; transition: transform .15s;
    }
    .mb-train-dot:hover { transform: scale(1.3); }

    /* Animated iron-ore train sprite (MapLibre positions via inline transform —
       direction flip lives on the inner .train-dir to avoid clobbering it) */
    .train-sprite { cursor: pointer; user-select: none; }
    .train-dir { transition: transform .3s ease; transform-origin: center; }
    .train-sprite svg { display: block; width: 76px; height: auto;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,.75)); transition: transform .15s; }
    .train-sprite:hover svg { transform: scale(1.12); }
    /* Smoke circles hidden — saved 3 simultaneous animations */
    .train-smoke { display: none; }
    .train-car { transform-box: fill-box; transform-origin: 50% 92%;
      animation: carWobble .85s ease-in-out infinite; }
    .train-car.c1 { animation-delay: .12s; }
    .train-car.c2 { animation-delay: .24s; }
    .train-car.c3 { animation-delay: .36s; }
    @keyframes carWobble {
      0%,100% { transform: rotate(-2.4deg) translateX(-.3px); }
      50%     { transform: rotate(2.4deg)  translateX(.3px);  }
    }

    /* ── World inset map ── */
    #worldInset {
      position: fixed; bottom: 48px; left: 12px; z-index: 20;
      width: 84px; height: 64px;
      background: rgba(10,6,2,.9);
      border: 1px solid rgba(232,200,122,.2);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 14px rgba(0,0,0,.55);
    }
    .inset-label {
      position: absolute; bottom: 3px; left: 0; right: 0;
      text-align: center; font-size: 6.5px; color: #6b5d42;
      letter-spacing: .8px; font-weight: 700;
      pointer-events: none; text-transform: uppercase;
    }
    /* Pulsing dot on inset */
    @keyframes insetPulse { 0%,100% { opacity: .6; r: 3px; } 50% { opacity: .2; r: 5px; } }
    .inset-dot-ring { animation: insetPulse 2.8s ease-in-out infinite; }

    /* ── Panel nav ── */
    .panel-nav { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px 0; margin-bottom: 4px; }
    .nav-btn {
      background: rgba(255,255,255,.07); border: 1px solid rgba(232,200,122,.2);
      color: #9a8060; border-radius: 99px; padding: 4px 14px; font-size: .72rem;
      cursor: pointer; transition: all .2s; display: flex; align-items: center; gap: 5px;
    }
    .nav-btn:hover { background: rgba(192,98,42,.35); color: var(--gold); border-color: var(--terracotta); }
    .nav-counter { font-size: .68rem; color: #6b5d42; }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      #app { height: 100dvh; }
      header { padding: 5px 10px 2px; }
      .logo-svg { height: 36px!important; }
      header > p { display: none; }
      .legend { gap: 3px; padding: 2px 8px; }
      .legend-item { font-size: .58rem; padding: 2px 6px; }
      .legend-dot { width: 7px; height: 7px; }
      .music-bar { padding: 3px 10px 6px; gap: 6px; }
      .music-btn { font-size: .7rem; padding: 4px 12px; }
      .music-info { font-size: .62rem; max-width: 130px; }
      #ytPlayer { width: 1px; height: 1px; bottom: 0; right: 0; }
      #worldInset { width: 64px; height: 50px; bottom: 42px; }
      .search-input { font-size: .68rem; }
      .cat-count { display: none; }
    }

    /* ── Music bar ── */
    .music-bar {
      flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 5px 12px 10px;
    }
    .music-btn {
      background: rgba(192,98,42,.5); border: 1.5px solid rgba(192,98,42,.8); color: var(--gold);
      border-radius: 99px; padding: 6px 18px; font-size: .8rem; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 7px; transition: background .2s, transform .2s;
      white-space: nowrap; box-shadow: 0 2px 12px rgba(192,98,42,.3);
    }
    .music-btn:hover { background: rgba(192,98,42,.72); transform: scale(1.03); }
    .music-info {
      font-size: .78rem; color: var(--gold); font-style: italic;
      background: rgba(0,0,0,.72); padding: 4px 12px; border-radius: 99px;
      border: 1px solid rgba(232,200,122,.2);
      max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .music-pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--terracotta); flex-shrink: 0; animation: mpulse 1.2s ease-in-out infinite; }
    @keyframes mpulse { 0%,100% { opacity: .4; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.2); } }

    #ytPlayer { position: fixed; bottom: 0; right: 0; width: 1px; height: 1px; overflow: hidden; opacity: .01; z-index: 1; display: block; }
    #ytPlayer iframe { width: 1px; height: 1px; border: none; display: block; }

    /* ── iOS tap-to-start overlay ── */
    #musicOverlay {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(8,4,1,.96);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      cursor: pointer; overflow: hidden;
    }
    /* Dune silhouette at bottom */
    .overlay-dunes {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 90px; pointer-events: none; display: block;
    }
    /* Star field on overlay */
    .overlay-stars {
      position: absolute; inset: 0; pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 10% 20%, rgba(232,200,122,.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 10%, rgba(232,200,122,.15) 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 8%,  rgba(232,200,122,.18) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 15%, rgba(232,200,122,.12) 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 25%, rgba(232,200,122,.1) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 90% 10%, rgba(232,200,122,.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 20% 45%, rgba(232,200,122,.08) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 40%, rgba(232,200,122,.1) 0%, transparent 100%);
    }
    .overlay-camel {
      font-size: 2.4rem;
      animation: camelBob 2s ease-in-out infinite;
      filter: drop-shadow(0 4px 14px rgba(192,98,42,.5));
      position: relative; z-index: 1;
    }
    @keyframes camelBob {
      0%,100% { transform: translateY(0); }
      40%     { transform: translateY(-5px); }
      60%     { transform: translateY(-3px); }
    }
    #musicOverlay h2 { font-family: 'Amiri', serif; color: var(--gold); font-size: 1.6rem; text-align: center; position: relative; z-index: 1; }
    #musicOverlay p  { color: #9a8060; font-size: .85rem; text-align: center; max-width: 260px; line-height: 1.5; position: relative; z-index: 1; }
    .tap-btn {
      background: rgba(192,98,42,.5); border: 2px solid var(--terracotta); color: var(--gold);
      border-radius: 99px; padding: 10px 30px; font-size: 1rem; font-weight: 600;
      animation: pulse-btn 1.8s ease-in-out infinite; cursor: pointer;
      position: relative; z-index: 1; display: flex; align-items: center; gap: 8px;
    }
    @keyframes pulse-btn { 0%,100% { box-shadow: 0 0 0 0 rgba(192,98,42,.4); } 50% { box-shadow: 0 0 0 14px rgba(192,98,42,0); } }

    /* ── Info panel ── */
    .panel-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 40; }
    .panel-backdrop.open { display: block; }
    .info-panel {
      position: fixed; right: -420px; top: 0; width: 360px; max-width: 96vw; height: 100vh;
      background: linear-gradient(160deg, #2a1a0a, #1a1005);
      border-left: 1px solid rgba(232,200,122,.2);
      z-index: 50; overflow-y: auto; transition: right .35s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column;
    }
    .info-panel.open { right: 0; }
    @media (max-width: 640px) {
      .info-panel { right: auto; left: 0; bottom: -100%; top: auto; width: 100%; height: 82vh; border-left: none; border-top: 1px solid rgba(232,200,122,.2); border-radius: 20px 20px 0 0; transition: bottom .35s cubic-bezier(.4,0,.2,1); }
      .info-panel.open { bottom: 0; }
    }

    /* Panel hero */
    .panel-hero-ph {
      width: 100%; height: 155px;
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    /* Diagonal stripe texture on hero — below the icon */
    .panel-hero-ph::before {
      content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background: repeating-linear-gradient(
        -45deg, transparent, transparent 22px,
        rgba(255,255,255,.022) 22px, rgba(255,255,255,.022) 44px
      );
    }
    /* Hero icon wrapper — sits above the stripe texture */
    .hero-icon-wrap {
      width: 80px; height: 80px;
      display: flex; align-items: center; justify-content: center;
      position: relative; z-index: 1;
    }
    .hero-icon-wrap svg { width: 100%; height: 100%; display: block; }

    .panel-close {
      position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%;
      background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.15); color: #bbb;
      cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10;
      transition: background .2s, color .2s;
    }
    .panel-close:hover { background: rgba(192,98,42,.4); color: var(--gold); }

    .panel-body { padding: 16px; flex: 1; }
    .panel-cat { display: inline-block; font-size: .67rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; padding: 2px 9px; border-radius: 99px; margin-bottom: 6px; }
    .panel-title { font-family: 'Amiri', serif; font-size: 1.55rem; color: var(--gold); margin-bottom: 3px; }
    .panel-sub  { font-size: .78rem; color: #9a8060; margin-bottom: 10px; }
    .panel-desc { font-size: .83rem; line-height: 1.65; color: #c8b090; margin-bottom: 14px; }
    .panel-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 14px; }
    .fact-card { background: rgba(255,255,255,.05); border: 1px solid rgba(232,200,122,.15); border-radius: 8px; padding: 8px 10px; transition: border-color .2s; }
    .fact-card:hover { border-color: rgba(232,200,122,.3); }
    .fact-label { font-size: .63rem; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: #8a7050; margin-bottom: 1px; }
    .fact-value { font-size: .83rem; font-weight: 600; color: var(--gold); }
    .panel-links { display: flex; flex-direction: column; gap: 7px; }
    .link-btn {
      display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 9px;
      text-decoration: none; font-size: .8rem; font-weight: 500;
      transition: transform .2s, filter .2s; border: 1.5px solid transparent;
    }
    .link-btn:hover { transform: translateX(4px); filter: brightness(1.1); }
    .link-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .link-instagram { background: linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); color: white; }
    .link-youtube   { background: #ff0000; color: white; }
    .link-wiki      { background: rgba(255,255,255,.9); color: #1a1208; border-color: rgba(200,160,80,.4); }
    .link-google    { background: #4285f4; color: white; }
    .link-maps      { background: #34a853; color: white; }

    /* info-panel slides in — composited on its own layer */
    .info-panel { will-change: right; }
    @media (max-width: 640px) { .info-panel { will-change: bottom; } }
  </style>
</head>
<body>

<canvas id="sandCanvas"></canvas>

<div id="app">
  <header>
    <!-- Logo: dune-wave motif + text -->
    <svg class="logo-svg" height="48" viewBox="0 0 240 54" xmlns="http://www.w3.org/2000/svg">
      <path d="M6,40 Q16,22 28,32 Q40,42 52,24 Q60,12 72,28"
            stroke="#c0622a" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <path d="M6,46 Q18,30 32,38 Q44,46 56,30 Q64,20 78,34"
            stroke="#e8c87a" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".55"/>
      <text x="90" y="26" font-family="Amiri,serif" font-size="20" fill="#e8c87a" font-weight="700">MAURITANIA</text>
      <text x="91" y="41" font-family="Inter,sans-serif" font-size="8.5" fill="#9e8b6e" letter-spacing="3.5">EXPLORER</text>
      <defs>
        <linearGradient id="lgLine" x1="0" x2="1">
          <stop offset="0%" stop-color="#c0622a"/>
          <stop offset="100%" stop-color="#3a8fa8" stop-opacity=".4"/>
        </linearGradient>
      </defs>
      <line x1="90" y1="46" x2="240" y2="46" stroke="url(#lgLine)" stroke-width="1"/>
    </svg>
    <p>Click on any location to discover it</p>

    <!-- Search bar -->
    <div class="search-row">
      <div class="search-wrap">
        <svg class="s-icon" width="13" height="13" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="#9e8b6e" stroke-width="2"/>
          <line x1="16.5" y1="16.5" x2="22" y2="22" stroke="#9e8b6e" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="text" class="search-input" id="searchInput" placeholder="Search locations…" autocomplete="off" spellcheck="false"/>
      </div>
      <button class="reset-btn" id="resetBtn">

// ── fly() — centralised flyTo with cubic-out easing (from Mapbox reference) ──
function fly(opts) {
  const o = Object.assign(
    { center: CONFIG.center, zoom: CONFIG.restingZoom, duration: CONFIG.flyDuration },
    opts
  );
  map.flyTo({
    center:    o.center,
    zoom:      o.zoom,
    essential: true,
    duration:  o.duration,
    easing:    cubicOut,
  });
}

// ── Desert colour palette ─────────────────────────────────────────────────────
function applyDesertPalette() {
  const styleData = map.getStyle();
  if (!styleData || !styleData.layers) return;
  const waterLayers = ['water','ocean','water-shadow','waterway'];
  styleData.layers.forEach(layer => {
    const id = layer.id;
    if (id === 'background' || id === 'land' || id === 'landcover') {
      try { map.setPaintProperty(id, 'background-color', '#1e1508'); } catch(e) {}
      try { map.setPaintProperty(id, 'fill-color',       '#1e1508'); } catch(e) {}
    }
    if (waterLayers.some(w => id.startsWith(w))) {
      try { map.setPaintProperty(id, 'fill-color', '#0e2030'); } catch(e) {}
      try { map.setPaintProperty(id, 'line-color', '#0e2030'); } catch(e) {}
    }
    if (id.includes('border') || id.includes('boundary')) {
      try { map.setPaintProperty(id, 'line-color',   '#c0622a'); } catch(e) {}
      try { map.setPaintProperty(id, 'line-opacity', 0.7);       } catch(e) {}
    }
    if (id.includes('label') || id.includes('place') || id.includes('city')) {
      try { map.setPaintProperty(id, 'text-color',       '#c8a870'); } catch(e) {}
      try { map.setPaintProperty(id, 'text-halo-color',  '#1a1208'); } catch(e) {}
    }
  });
}

// ── Markers with custom SVG icons ─────────────────────────────────────────────
function addMarkers() {
  let delay = 0;
  Object.keys(PLACES).forEach(id => {
    const p    = PLACES[id];
    const coord = COORDS[id];
    if (!coord) return;

    const iconSvg = ICONS[PLACE_ICON[id] || 'city'];

    const el = document.createElement('div');
    el.className = 'mb-marker';
    el.setAttribute('data-cat', p.category);
    el.setAttribute('data-id',  id);
    delay += 80; // animation-delay applied inline on .mb-marker-inner

    // mb-marker-inner wrapper carries the drop animation so MapLibre's inline
    // transform on the outer element is never clobbered (main fix).
    // SVG icon replaces emoji; animation-delay set on the inner wrapper.
    el.innerHTML = `<div class="mb-marker-inner" style="animation-delay:${delay}ms"><div class="mb-icon">${iconSvg}</div><div class="mb-label">${p.name.split(' ').slice(0,2).join(' ')}</div></div>`;

    el.onclick = () => {
      el.classList.add('clicked');
      setTimeout(() => el.classList.remove('clicked'), 600);
      emphasizeMarker(el);
      openPlace(id);
    };

    // Center anchor keeps the circular badge centred on its real coordinate so it
    // does not float north of the point (which made border-adjacent markers like
    // Ben Amera appear to spill across the Mauritania–Western Sahara border).
    const marker = new maplibregl.Marker({ element: el, anchor: 'center' })
      .setLngLat(coord)
      .addTo(map);

    MARKERS.push({ id, marker, cat: p.category, el });
  });
}

// ── Emphasize / deselect (from Mapbox reference pattern) ─────────────────────
function emphasizeMarker(el) {
  if (currentMarkerEl && currentMarkerEl !== el) {
    currentMarkerEl.classList.remove('emphasized');
  }
  currentMarkerEl = el;
  el.classList.add('emphasized');
}

function deselectMarker() {
  if (currentMarkerEl) {
    currentMarkerEl.classList.remove('emphasized');
    currentMarkerEl = null;
  }
}

// ── Animated iron-ore train sprite ───────────────────────────────────────────
(function initTrainSprite() {
  const route = TRAIN_LINE; // full real SNIM rail path, Zouérat → Nouadhibou
  function lngLatDist(a, b) {
    const dx = (b[0]-a[0])*Math.cos((a[1]+b[1])*Math.PI/360);
    const dy = b[1]-a[1];
    return Math.sqrt(dx*dx+dy*dy);
  }
  // Pre-compute per-segment lengths so the train follows the polyline exactly.
  const segLen = [];
  let total = 0;
  for (let i = 0; i < route.length - 1; i++) { const L = lngLatDist(route[i], route[i+1]); segLen.push(L); total += L; }
  function posAt(phase) {
    let target = Math.max(0, Math.min(1, phase)) * total;
    for (let i = 0; i < segLen.length; i++) {
      if (target <= segLen[i] || i === segLen.length - 1) {
        const f = segLen[i] ? target / segLen[i] : 0;
        return [route[i][0]+(route[i+1][0]-route[i][0])*f, route[i][1]+(route[i+1][1]-route[i][1])*f];
      }
      target -= segLen[i];
    }
    return route[route.length - 1];
  }

  // Build the iron-ore train SVG: locomotive + 3 hopper wagons.
  // `loaded=true` = ore heaped on wagons (Zouérat→Nouadhibou);
  // `loaded=false` = open empty hoppers (return leg).

    const wagon = (ox) => {
      const coupling = `<rect x="${ox-3}" y="18.5" width="4" height="1.6" fill="#4a4138"/>`;
      const body     = `<path d="M${ox} 12 L${ox+20} 12 L${ox+17} 22 L${ox+3} 22 Z" fill="#2c2824" stroke="#120d07" stroke-width="0.8"/>`;
      const chassis  = `<rect x="${ox+2}" y="22" width="16" height="1.8" fill="#1c150d"/>`;
      const wheels   = `<circle cx="${ox+5}" cy="25" r="2.4" fill="#0e0a05" stroke="#5a5048" stroke-width="0.6"/>`+
                       `<circle cx="${ox+15}" cy="25" r="2.4" fill="#0e0a05" stroke="#5a5048" stroke-width="0.6"/>`;
      const fill = loaded
        ? `<path d="M${ox+1} 12 Q${ox+6} 6.5 ${ox+10} 7.5 Q${ox+14} 6.5 ${ox+19} 12 Z" fill="url(#ore)"/>`+
          `<circle cx="${ox+6}" cy="9.7" r="1.1" fill="#9a5326"/><circle cx="${ox+11}" cy="9" r="1.2" fill="#a85b2b"/><circle cx="${ox+15}" cy="9.9" r="1" fill="#854720"/>`
        : `<path d="M${ox+2} 12 L${ox+18} 12 L${ox+15.5} 20 L${ox+4.5} 20 Z" fill="#140f0a"/>`+
          `<line x1="${ox}" y1="12" x2="${ox+20}" y2="12" stroke="#3a342e" stroke-width="0.9"/>`;
      return coupling+body+fill+chassis+wheels;
    };
    const loco = `<g class="train-car c0">`+
      `<rect x="3" y="21" width="26" height="2.4" fill="#15151c"/>`+
      `<rect x="4" y="12" width="15" height="9" rx="1" fill="#3a3a45"/>`+
      `<rect x="19" y="7" width="9" height="14" rx="1" fill="#43434f"/>`+
      `<rect x="21" y="9" width="5.2" height="4.2" rx="0.6" fill="#9fd2e2"/>`+
      `<rect x="4" y="17.6" width="24" height="2" fill="#c0622a"/>`+
      `<rect x="8" y="9" width="3" height="3.2" fill="#1c1c22"/>`+
      `<circle cx="5" cy="15.4" r="1.5" fill="#ffe7a0"/>`+
      `<circle cx="7.5" cy="25" r="2.7" fill="#0e0a05" stroke="#5a5048" stroke-width="0.7"/>`+
      `<circle cx="14" cy="25" r="2.7" fill="#0e0a05" stroke="#5a5048" stroke-width="0.7"/>`+
      `<circle cx="23" cy="25" r="2.7" fill="#0e0a05" stroke="#5a5048" stroke-width="0.7"/>`+
    `</g>`;
    return `<svg width="104" height="34" viewBox="0 0 104 34" xmlns="http://www.w3.org/2000/svg">`+
      `<defs><linearGradient id="ore" x1="0" y1="0" x2="0" y2="1">`+
        `<stop offset="0" stop-color="#a85b2b"/><stop offset="1" stop-color="#5a2c10"/></linearGradient></defs>`+
      `<g class="train-car c1">`+wagon(32)+`</g>`+

      loco+
      `<circle class="train-smoke" cx="9.5" cy="8" r="2.1" fill="#b8b1a4"/>`+
      `<circle class="train-smoke s2" cx="9.5" cy="8" r="1.7" fill="#cdc6ba"/>`+
      `<circle class="train-smoke s3" cx="9.5" cy="8" r="1.9" fill="#a59e92"/>`+
    `</svg>`;
  }

  const el = document.createElement('div');
  el.className = 'train-sprite';
  el.title = 'Iron Ore Train';
  el.onclick = () => openPlace('train');

  // Inner wrapper carries the direction flip so MapLibre's positioning transform
  // on `el` is never overwritten.
  const dirEl = document.createElement('div');
  dirEl.className = 'train-dir';
  el.appendChild(dirEl);

  let loaded = true;
  dirEl.innerHTML = trainSVG(loaded);

  const sprite = new maplibregl.Marker({ element: el, anchor: 'center' })
    .setLngLat(route[0])
    .addTo(map);

  const SPEED = 0.0006; // fraction of total route per frame
  let going = 1; // +1 = Zouérat→Nouadhibou (loaded), -1 = return (empty)
  let phase = 0;

  function applyDirection() { dirEl.style.transform = going === 1 ? 'scaleX(1)' : 'scaleX(-1)'; }
  function setLoaded(v) { if (v !== loaded) { loaded = v; dirEl.innerHTML = trainSVG(loaded); } }
  applyDirection();

  function tick() {
    phase += SPEED * going;
    if (phase >= 1) { phase = 1; going = -1; setLoaded(false); applyDirection(); }
    if (phase <= 0) { phase = 0; going =  1; setLoaded(true);  applyDirection(); }
    sprite.setLngLat(posAt(phase));
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

// ── Search + filter system (from Mapbox reference pattern) ────────────────────
const searchInput = document.getElementById('searchInput');
const resetBtn    = document.getElementById('resetBtn');

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchTerm = searchInput.value.trim().toLowerCase();
    applyFilters();
  }, 180);
});

resetBtn.addEventListener('click', resetAll);

function updateCategoryCounts() {
  const counts = { all: 0, nature: 0, historic: 0, transport: 0, city: 0 };
  Object.keys(PLACES).forEach(id => {
    const p = PLACES[id];
    const matchesCat    = currentCat === 'all' || p.category === currentCat;
    const matchesSearch = !searchTerm ||
      p.name.toLowerCase().includes(searchTerm) ||
      p.subtitle.toLowerCase().includes(searchTerm);
    if (matchesCat && matchesSearch) {
      counts.all++;
      if (counts[p.category] !== undefined) counts[p.category]++;
    } else if (!matchesCat && matchesSearch) {
      // count all visible regardless of active cat filter
    }
  });

  // For counts, show how many match the SEARCH within each category
  const allCounts = { all: 0, nature: 0, historic: 0, transport: 0, city: 0 };
  Object.keys(PLACES).forEach(id => {
    const p = PLACES[id];
    const matchesSearch = !searchTerm ||
      p.name.toLowerCase().includes(searchTerm) ||
      p.subtitle.toLowerCase().includes(searchTerm);
    if (matchesSearch) {
      allCounts.all++;
      if (allCounts[p.category] !== undefined) allCounts[p.category]++;
    }
  });

  Object.keys(allCounts).forEach(k => {
    const el = document.getElementById('cnt-' + k);
    if (el) el.textContent = allCounts[k];
  });
}

function applyFilters() {
  updateCategoryCounts();

  const visibleMarkers = [];

  MARKERS.forEach(({ id, marker, cat, el }) => {
    const p = PLACES[id];
    const matchesCat    = currentCat === 'all' || cat === currentCat;
    const matchesSearch = !searchTerm ||
      p.name.toLowerCase().includes(searchTerm) ||
      p.subtitle.toLowerCase().includes(searchTerm);
    const show = matchesCat && matchesSearch;

    marker.getElement().style.opacity        = show ? '1'   : '0.07';
    marker.getElement().style.pointerEvents  = show ? 'all' : 'none';

    // Deselect emphasized marker if it's now hidden
    if (!show && currentMarkerEl === el) deselectMarker();
    if (show) visibleMarkers.push(marker);
  });

  // Train line visibility
  const trainShow = (currentCat === 'all' || currentCat === 'transport') &&
    (!searchTerm || 'iron ore train'.includes(searchTerm));
  try {
    map.setPaintProperty('train-line', 'line-opacity', trainShow ? .8 : .04);
    map.setPaintProperty('train-bg',   'line-opacity', trainShow ? .18 : .02);
  } catch(e) {}

  // Reset button visibility
  const hasFilter = currentCat !== 'all' || searchTerm.length > 0;
  resetBtn.classList.toggle('visible', hasFilter);

  // Fit bounds to visible markers when searching (from Mapbox reference)
  if (searchTerm.length > 0) {
    if (visibleMarkers.length === 1) {
      fly({ center: visibleMarkers[0].getLngLat(), zoom: CONFIG.flyZoom });
    } else if (visibleMarkers.length > 1 && visibleMarkers.length < 9) {
      const bounds = new maplibregl.LngLatBounds();
      visibleMarkers.forEach(m => bounds.extend(m.getLngLat()));
      map.fitBounds(bounds, { padding: 90, duration: 1800, maxZoom: 9, easing: cubicOut });
    }
  }
}

function filterCat(el, cat) {
  document.querySelectorAll('.legend-item').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  currentCat = cat;
  applyFilters();
}

function resetAll() {
  searchInput.value = '';
  searchTerm = '';
  currentCat = 'all';
  document.querySelectorAll('.legend-item').forEach((e, i) => e.classList.toggle('active', i === 0));
  deselectMarker();
  applyFilters();
  fly({ center: CONFIG.center, zoom: CONFIG.restingZoom, duration: CONFIG.flyDuration });
}

// ── Info panel ────────────────────────────────────────────────────────────────
const PLACE_KEYS = Object.keys(PLACES);
let currentPlaceIdx = 0;

function navPlace(dir) {
  currentPlaceIdx = (currentPlaceIdx + dir + PLACE_KEYS.length) % PLACE_KEYS.length;
  openPlace(PLACE_KEYS[currentPlaceIdx]);
}

function openPlace(id) {
  const p = PLACES[id];
  if (!p) return;
  const c   = CAT[p.category];
  const idx = PLACE_KEYS.indexOf(id);
  if (idx >= 0) currentPlaceIdx = idx;
  document.getElementById('navCounter').textContent = `${currentPlaceIdx+1} / ${PLACE_KEYS.length}`;

  // Hero: large SVG icon with category gradient background
  const iconSvg = ICONS[PLACE_ICON[id] || 'city'];
  // Inject explicit width/height into the svg tag so it renders at 80×80 without CSS dependency
  const sizedSvg = iconSvg.replace('<svg ', '<svg width="80" height="80" ');
  const hero = document.getElementById('panelHero');
  hero.style.cssText = `background: linear-gradient(135deg, ${p.categoryColor}30, ${p.categoryColor}60), linear-gradient(160deg, #2a1a0a, #1a0f04); width:100%; height:155px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;`;
  hero.innerHTML = `<div style="width:80px;height:80px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 4px 20px ${p.categoryColor})">${sizedSvg}</div>`;

  const badge = document.getElementById('panelCat');
  badge.textContent = p.category.charAt(0).toUpperCase() + p.category.slice(1);
  badge.style.cssText = `background:${c.bg};color:${c.text};border:1.5px solid ${c.border}`;

  document.getElementById('panelTitle').textContent = p.name;
  document.getElementById('panelSub').textContent   = p.subtitle;
  document.getElementById('panelDesc').textContent  = p.desc;
  document.getElementById('panelFacts').innerHTML   = p.facts.map(f =>
    `<div class="fact-card"><div class="fact-label">${f.label}</div><div class="fact-value">${f.value}</div></div>`
  ).join('');
  document.getElementById('panelLinks').innerHTML = p.links.map(l =>
    `<a href="${l.url}" target="_blank" rel="noopener" class="link-btn ${l.style}">${LINK_ICONS[l.icon] || ''}${l.label}</a>`
  ).join('');

  document.getElementById('infoPanel').classList.add('open');
  document.getElementById('backdrop').classList.add('open');

  const coord = COORDS[id];
  if (coord) {
    fly({ center: coord, zoom: id === 'train' ? 6 : CONFIG.flyZoom, duration: 1400 });
  }
}

function closePanel() {
  document.getElementById('infoPanel').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
  deselectMarker();
  fly({ center: CONFIG.center, zoom: CONFIG.restingZoom, duration: 1200 });
}

// ── Sand particle system (throttled to ~25 fps, 20 particles) ─────────────────
const sandCanvas = document.getElementById('sandCanvas');
const ctx = sandCanvas.getContext('2d');
let particles = [];
let sandPaused = false;
let sandHidden = false; // paused when tab not visible

function resizeSand() {
  sandCanvas.width  = window.innerWidth;
  sandCanvas.height = window.innerHeight;
}
resizeSand();
window.addEventListener('resize', resizeSand);

function mkParticle() {
  return {
    x: Math.random() * sandCanvas.width,
    y: Math.random() * sandCanvas.height,
    vx: .18 + Math.random() * .28,
    vy: .05 + Math.random() * .15,
    size: .9 + Math.random() * 1.5,
    opacity: .18 + Math.random() * .32,
  };
}
for (let i = 0; i < 20; i++) particles.push(mkParticle());

function drawSand() {
  if (!sandPaused && !sandHidden) {
    ctx.clearRect(0, 0, sandCanvas.width, sandCanvas.height);
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(232,200,122,${p.opacity})`;
      ctx.fill();
      p.x += p.vx; p.y += p.vy;
      if (p.x > sandCanvas.width  + 2) { p.x = -2; p.y = Math.random() * sandCanvas.height; }
      if (p.y > sandCanvas.height + 2) { p.y = -2; p.x = Math.random() * sandCanvas.width;  }
    });
  }
  // ~25 fps — skip every other frame to cut CPU in half vs rAF at 60 fps
  setTimeout(() => requestAnimationFrame(drawSand), 40);
}
drawSand();

// Pause particles when info panel open or tab hidden
new MutationObserver(() => {
  sandPaused = document.getElementById('infoPanel').classList.contains('open');
}).observe(document.getElementById('infoPanel'), { attributes: true, attributeFilter: ['class'] });

document.addEventListener('visibilitychange', () => {
  sandHidden = document.hidden;
});

function startMusic() {
  const start = picked.start ? `&start=${picked.start}` : '';

  btn.childNodes[0].innerHTML = PAUSE_PATH;
  btn.lastChild.textContent = ' Pause';
  pulse.style.display = 'block';
}

function handleOverlayTap() {
  overlay.style.display = 'none';
  startMusic();
}

function toggleMusic() {
  if (!musicOn) {
    startMusic();
  } else {
    ytDiv.innerHTML = '';
    musicOn = false;
    btn.childNodes[0].innerHTML = PLAY_PATH;
    btn.lastChild.textContent = ' Play Music';
    pulse.style.display = 'none';
  }
}
